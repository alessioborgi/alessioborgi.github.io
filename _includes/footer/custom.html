<!-- Support for MathJax -->
<script>
  // MathJax 3 does NOT process single-dollar inline math by default: out of the
  // box it recognises \(...\) inline and $$...$$ / \[...\] display only. Many
  // posts write inline maths as $H_1$ or $\sigma_j$, which was therefore shown
  // to readers as literal LaTeX source. Register $...$ as an inline delimiter.
  //
  // Safe here because the posts contain no unbalanced single dollars, and the
  // only genuine currency amounts are escaped as \$. processEscapes keeps that
  // working; skipHtmlTags leaves code, pre and Mermaid blocks untouched.
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'language-mermaid|language-plotly'
    }
  };
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
