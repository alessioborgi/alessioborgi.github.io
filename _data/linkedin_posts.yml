  body: "\U0001F4DD\U0001F4BB Last week I had an incredible weekend in **Podgorica**
    \U0001F1F2\U0001F1EA at the EEML **Montenegrin Machine Learning Workshop** (**MMLW**
    2025), part of the EEML Workshops series, co-organised by Montenegrin AI Association!
    The event took place on 8 November 2025 at the Science and Technology Park and
    the Faculty of Electrical Engineering, University of Montenegro, bringing a true
    top-tier AI conference experience to Eastern Europe. \n\nI was really grateful
    for the chance to learn, connect, and get inspired by a lineup of amazing speakers,
    from DeepMind, Mila - Quebec Artificial Intelligence Institute, and Nokia Bell
    Labs. Starting with Razvan Pascanu on the foundations of deep learning and inductive
    bias, we then explored with\nPetar Veličković on thinking and geometry in AI through
    Graph Neural Networks, Sanja Šćepanović-Stojanović, PhD, on using AI for remote
    sensing and understanding our planet, Natasha Latysheva on AI for biology and
    genomics, Anna Varbella on AI for power grids and networked systems, along with
    other excellent talks on mechanistic interpretability and real-world ML applications.
    \n\n\U0001F4DA \U0001F5E3 I also had the pleasure of presenting my **poster**
    “**Polynomial Sheaf Diffusion and Equivariant Sheaf Neural Networks**”, my master
    thesis research developed with Professors Pietro Lio' and Fabrizio Silvestri,
    sharing some of my latest research on sheaf-based geometric deep learning and
    its applications. \n\n\U0001F680 Huge thanks to the EEML team and the Montenegrin
    AI Association for organising such a smooth and inspiring event and for their
    broader mission of supporting and growing the ML community in the region. \n#EEML
    #MMLW2025 #MachineLearning #AI #Podgorica #EasternEuropeAI #MAIA #Montenegro #Podgorica
    #SheafNeuralNetworks"
