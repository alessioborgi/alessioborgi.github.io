- title: Master's Degree Graduation! Artificial Intelligence and Robotics
  date: '2025-10-27'
  place: "Sapienza University of Rome, Italy \U0001F1EE\U0001F1F9"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7388639893910077440/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7388639893910077440/
  body: "\U0001F393 I am proud to share that I have officially **graduated** with
    a **Master**’**s Degree** in **Artificial Intelligence and Robotics** with a final
    grade of 110/110, at Sapienza Università di Roma and in collaboration with the
    University of Cambridge.\n\nMy thesis, “**Polynomial Sheaf Diffusion** & **Equivariant
    Sheaf Neural Networks**” focused on advancing the capabilities of Graph Neural
    Networks. In particular, I worked on:\n• **Polynomial Sheaf Diffusion** (**PolySD**):
    a more efficient way to diffuse information across a graph, improving speed and
    stability in complex systems.\n • **Equivariant Sheaf Neural Networks** (**EquiSheafNNs**):
    models that are aware of geometry and symmetries (rotations, translations, local
    reference frames), enabling AI to reason about physically structured systems such
    as multi-particle dynamics and molecular interactions.\n\nPossible applications
    of that range from physical simulation and robotics control to molecular and structural
    modeling, with state-of-the-art results across several benchmarks. \n\nThis milestone
    is the result of a journey, not just a final exam. I would like to thank my supervisors,
    for their guidance, scientific rigor, and trust. As always, nothing could have
    been achieved without the unwavering support of **my family**, **my parents**,
    **my sister**, **my girlfriend**, **my grandparents**, **my uncles** who have
    put into this path lots of sacrifices, and belief in me.\n\nOn to the next challenge.
    \U0001F680\n#ArtificialIntelligence #Robotics #DeepLearning #GraphNeuralNetworks
    #Research #MachineLearning #Graduation"
  gallery: "/images/linkedin/master-s-degree-graduation-artificial-intelligence-and-robot/"
- title: OxML 2025 - Oxford Machine Learning Summer School
  date: '2025-08-13'
  place: "London School of Economics, UK \U0001F1EC\U0001F1E7 and University of Oxford,
    UK \U0001F1EC\U0001F1E7"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7360407456448921600/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7360407456448921600/
  body: "\U0001F680 Two unforgettable weeks at the University of Oxford! \U0001F393\U0001F1EC\U0001F1E7\n
    This month I joined the OxML **Oxford Machine Learning Summer School** for **MLx
    Health** & **Bio** and **MLx Representation Learning** & **Generative AI** at
    the **Mathematical Institute**, **University of Oxford**. The depth, community,
    and real-world focus were outstanding. \n\nA few standout highlights (very brief
    \U0001F447):\n- Michael Bronstein (University of Oxford; AITHYRA Research Institute
    for Biomedical Artificial Intelligence): Symmetry/equivariance as the engine of
    generalisation in GDL. \n- **Brian Hie** (Stanford University): Genome/protein
    foundation models and sequence. \n- **Vivek Natarajan** (Google): The AI co-scientist,
    an agentic systems accelerating hypothesis generation in biomedicine. \n- Moritz
    Kraemer, PhD (University of Oxford): ML for pandemic preparedness: surveillance,
    geospatial modelling, forecasting. \n- Emma Robinson (King's College London):
    Robust, clinically grounded AI for medical imaging. \n- Zeyu Gao (University of
    Cambridge): Multimodal + multi-omics fusion pipelines in oncology. \n- **Edward
    Johns** (Imperial College London): Representation learning + GenAI in robotics.
    \n- Arthur Gretton (UCL; DeepMind): Causal effect estimation with context & confounders.
    \n- Abdul Fatir Ansari (AWS AI Labs): Time-series Foundation Models. \n\nHuge
    thanks to the organizers AI for Global Goals and CIFAR, the speakers, DeepMind
    and G-Research, and everyone I met for the discussions and inspiration. Now back
    to work, full of ideas. \U0001F52C\U0001F4A1\n\n#OxML #OxfordUniversity #MachineLearning
    #GenerativeAI #RepresentationLearning #HealthTech #Bioinformatics #DeepLearning
    #OnDeviceAI #Causality #MedicalImaging #MultiOmics #AIforGood"
  gallery: "/images/linkedin/oxml-2025-oxford-machine-learning-summer-school/"
- title: 'Visiting Research - TESP Robotics '
  date: '2025-07-27'
  place: "Sendai, Japan \U0001F1EF\U0001F1F5"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7357088980607057920/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7357088980607057920/
  body: "\U0001F315\U0001F3C6 Back from **Japan** \U0001F1EF\U0001F1F5 – **TESP Robotics
    Summer School** 2025!\n\nI had the incredible opportunity to take part in the
    **TESP Robotics Summer School** held at Tohoku University in  **Japan**, working
    in the Space Robotics Laboratory of Professor Kazuya Yoshida on a challenging
    and exciting project: **MoonBot**‑**Navigation** \U0001F680\U0001F916\n\nThe goal
    of our project was to design and build from scratch an autonomous mobile robot
    capable of operating in a simulated lunar environment, navigating over sandy terrain,
    avoiding obstacles, and interacting with target objects.\nWe equipped the robot
    with:\n✅ Custom mechanical and electronic design\n✅ SLAM-based localization\n✅
    A planning system based on a Retraction algorithm + Dijkstra\n✅ Visual support
    via a camera and YOLO-based detection of “turtle” targets\n✅ A linear gripper
    for physical interaction with the environment\n\n\U0001F3C5 I’m proud to share
    that **our team won** 1**st place** in the **final TESP** 2025 **competition**,
    which included teams from various domains (robotics, mechanics, materials…), and
    we were honored to receive a **Certificate of Excellence** in Research.\n\nA heartfelt
    thank you to my Sapienza professor in Robotics Alessandro De Luca for having selected
    me to partecipate to this straordinary experience and to the Space Robotics professor
    Kazuya Yoshida at Tohoku for providing such an inspiring and unforgettable experience.
    \ A special thanks also to my teammates Kristjan Tarantelli  Rasmus Börjesson
    Dahlstedt  and Andre Khoo. A final big thanks to Matteo Brugnera  and Keita Nagaoka
    for the special environment and help they offered during the lab time. \n\n\U0001F517
    **Check out our project on GitHub**:\n\U0001F449 https://lnkd.in/dHHkNa_r\n\n#Robotics
    #TESP2025 #SLAM #PathPlanning #YOLO #MoonExploration #ResearchExcellence #Grateful
    #GitHubProject #AutonomousRobots #MoonBot"
  gallery: "/images/linkedin/visiting-research-tesp-robotics/"
