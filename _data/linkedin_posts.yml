- title: 'PhD Started: Graph Neural Networks and Generative AI'
  date: '2025-11-01'
  place: "Sapienza University of Rome, Italy \U0001F1EE\U0001F1F9, University of Cambridge,
    UK \U0001F1EC\U0001F1E7"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7400297093593993216/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7400297093593993216/
  body: "About a month ago, after concluding my master's degree path, I officially
    started my **PhD** in **Graph Neural Networks and Generative AI** \U0001F393\U0001F916\n\nFrom
    the very beginning, I’ll dive into topics that I’m genuinely excited about: **Sheaf
    Neural Networks**, **Geometric Deep Learning** and their connections with **Generative
    AI**. This feels like exactly where I want to be right now. \n\nFor me, this isn’t
    just a “next academic step”. Since I was young, I’ve always had two superheroes:
    my **Dad**, who has always worked in IT \U0001F4BB, and **Leonardo da Vinci** \U0001F3A8\U0001F527.
    Growing up, seeing my dad in the IT world made technology feel natural, almost
    like a second language. Entering the same IT and AI environment wasn’t random:
    it was my way of walking along a path that started at home, in the stories he
    told me and in the passion he passed on. Leonardo da Vinci, on the other hand,
    has always represented for me what a true scientist is: **curious**, **multidisciplinary**, **unafraid
    to cross boundaries and explore the unknown**. Today, I see research scientists
    and experts as the “Leonardos” of our time, and this PhD is my way of trying to
    become one of them, in my own small way. \n\nI am incredibly grateful for this
    opportunity, excited for the challenges ahead, and ready to give my best. I am
    extremely thankful to my professors for believing in me since the very first moment
    when my master's thesis started and for giving me the chance to grow as a researcher
    alongside them \U0001F64F✨\n \n**I will put all myself**, **doing what I love
