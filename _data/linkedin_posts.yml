- title: Sheaf Neural Networks as Message Passing — New Repository Release
  subtitle: sheaf-mpnn
  date: '2026-05-27'
  place: ''
  url: https://www.linkedin.com/posts/alessio-borgi_sheafneuralnetworks-graphneuralnetworks-geometricdeeplearning-ugcPost-7465295694443048960-k0A9/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7465295694443048960/
  body: "\U0001F680 Excited to share that we are **releasing** the **new repository
    sheaf**-**mpnn** for **Sheaf Neural Networks as Message Passing** today.\n\nOver
    the past years, **Sheaf Neural Networks** have shown great potential for graph
    learning, especially in settings where relational structure is complex and standard
    message passing can be limiting. However, working with these models has often
    required navigating research code that was not always easy to extend, reuse, or
    adapt to new experiments.\n\nWith this repository, our goal is to **make Sheaf
    Neural Networks more accessible to the community**: a clean PyTorch / PyG implementation
    where, in just a few lines of code, you can instantiate and run a Sheaf Neural
    Network\n\nIn this first release, we provide the core Neural Sheaf Diffusion implementation,
    together with experiment presets, automatic dataset handling, hyperparameter sweeps,
    and a benchmark suite covering both homophilic and heterophilic graph datasets.
    This is only the beginning: future releases will progressively extend the library
    with additional Sheaf Neural Network variants, making the framework even more
    flexible and complete.\n\nWe hope this repository can serve as a useful starting
    point for researchers and practitioners interested in exploring Sheaf Neural Networks,
    geometric deep learning, and more expressive forms of graph message passing.\n\n**You
    can find the GitHub Repository Link in the Comments** \n\nSo grateful for my teammates'
    massive efforts and ongoing dedication to this project: Luke Braithwaite, Mario
    Severino, Emanuele Mule, Fabrizio Silvestri, and Pietro Lio'.\n\nLooking forward
    to sharing more soon. Stay tuned for the upcoming paper release: “**Sheaf Neural
    Networks as a Message Passing Framework**” .\n\n#SheafNeuralNetworks #GraphNeuralNetworks
    #GeometricDeepLearning #PyTorch #PyTorchGeometric #MachineLearning #AIResearch
    #OpenSource #MessagePassing"
