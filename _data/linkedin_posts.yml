- title: 'Remember to Forget: Gated Adaptive Positional Encoding - New Preprint Release'
  date: '2026-05-12'
  place: ''
  url: https://www.linkedin.com/posts/alessio-borgi_machinelearning-deeplearning-transformers-share-7459985689619865600-N-nn/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:share:7459985689619865600/
  body: "\U0001F680 Excited to share our new work: “**Remember to Forget**: **Gated
    Adaptive Positional Encoding**”.\n\nThis work was done with my co-authors Riccardo
    Ali, Christopher Irwin, Mario Severino, and Pietro Lio' at the University of Cambridge.
    I am so grateful for this great collaboration with such amazing friends!\n\n\U0001F9ED
    **Why positional encodings matter**?\nTransformers process tokens through attention,
    but attention alone does not know the order of a sequence. **Positional encodings**
    (**PEs**) inject this notion of order, helping models understand where each token
    appears in the context. This becomes essential as modern LLMs move toward longer
    context windows. But long-context modeling is not only about remembering more.
    Sometimes, the **real challenge is knowing what to forget**.\n\n⚠️ **The problem**:
    **RoPE and Long**-**Context Hallucination**\nA widely used PE is **RoPE** which
    provides strong local positional geometry, but beyond the training context it
    can enter **unstable OOD regimes**, causing irrelevant distant tokens to appear
    spuriously related to the query. We call this **positional hallucination**: a
    critical issue for **retrieval**, where models must suppress background noise
    while preserving the few distant tokens that matter.\n\n\U0001F4A1 **Our idea**\nWe
    introduce **GAPE** — **G**ated **A**daptive **P**ositional **E**ncoding, a drop-in
    augmentation for positional encodings that improves long-context robustness in
    Transformers.\nThe core idea is simple:\n\U0001F539 RoPE preserves local geometry,
    but can suffer from long-range phase hallucinations beyond the training context.\n\U0001F539
    Fixed distance biases such as ALiBi suppress distant tokens, but may erase useful
    evidence for retrieval.\n\U0001F539 GAPE separates these roles: it learns when
    to suppress irrelevant context and when to preserve important distant tokens.\n\n\U0001F527
    **How GAPE works**\nGAPE introduces two adaptive signals:\n✅ A **query gate**,
    controlling how strongly irrelevant context is contracted;\n✅ A **key landmark
    gate**, protecting salient distant tokens from being forgotten.\nIn other words,
    GAPE forgets irrelevant background while keeping meaningful long-range information
    accessible.\n\n\U0001F4CA **Results**\nAcross our experiments, GAPE:\n✅ Improves
    length extrapolation;\n✅ Reduces attention entropy, leading to sharper attention;\n✅
    Strengthens retrieval on Needle-in-a-Haystack and long-context benchmarks;\n✅
    Works within standard scaled dot-product attention, making it compatible with
    FlashAttention-style kernels.\n\n\U0001F511 **Key Takeaways**\nLong-context modeling
    should not only extend memory. It should learn selective memory: forgetting irrelevant
    context while preserving the tokens that matter for retrieval. \n\n#MachineLearning
    #DeepLearning #Transformers #LongContext #Attention #PositionalEncoding #RoPE
    #PE #ArtificialIntelligence"
  gallery: "/images/linkedin/remember-to-forget-gated-adaptive-positional-encoding-new-pr/"
- title: HetSheaf — New Preprint Version
  subtitle: Heterogeneous Sheaf Neural Networks
  date: '2026-04-20'
  place: ''
  url: https://www.linkedin.com/posts/alessio-borgi_graphneuralnetworks-geometricdeeplearning-activity-7452038422040502272-rNYR
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7452038422040502272/
  body: "\U0001F680 We are excited to share the **new preprint** version of **HetSheaf**:
    **Heterogeneous Sheaf Neural Networks**. \n\nIn this new version, we significantly
    extend the paper by showing how **heterogeneous sheaf neural networks** provide
    a principled and parameter-efficient way to learn on heterogeneous graphs, where
    nodes and edges belong to different types and feature spaces. Compared to the
    previous version, we expand the experimental evaluation across node classification,
    graph classification, and link prediction, adding broader comparisons, stronger
    ablations, and deeper analysis of heterogeneous sheaf predictors.\n \nA key new
    addition is **SheafPool**, our new **graph**-**level readout for sheaf networks**.
    Since node embeddings in sheaf models live in local stalk spaces, standard pooling
    is not enough. SheafPool addresses this with a **gauge**-**aware**, **permutation**-**invariant
    stalk**-**space pooling mechanism**, making graph classification in sheaf neural
    networks well defined and effective for the first time. \n\nMore broadly, **HetSheaf**
    shows that heterogeneity can be encoded directly in the data representation through
    cellular sheaves, rather than only through increasingly specialized architectures.
    \n\nReally excited about the directions this opens for heterogeneous geometric
    deep learning. A huge thanks to all my wonderful collaborators: Luke Braithwaite,
    Gabriele Onorato, Kristjan Tarantelli, Iulia Duta, Francesco Restuccia, Fabrizio
    Silvestri and Pietro Lio'.\n\n\U0001F4C4 \U0001F449  **Paper**: https://lnkd.in/dAFenq7W
    \n\n#GraphNeuralNetworks #GeometricDeepLearning #MachineLearning #AIResearch #HeterogeneousGraphs
    #SheafNN"
