- title: New Paper Out! Polynomial Neural Sheaf Diffusion - PrePrint
  subtitle: A Spectral Filtering Approach on Cellular Sheaves
  date: '2025-12-03'
  place: ''
  url: https://www.linkedin.com/feed/update/urn:li:activity:7401578982523076611/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7401578982523076611/
  body: "\U0001F680\U0001F4C3 **New paper out**!\n\nI’m excited to share my new preprint
    coming from the master's thesis work, “**Polynomial Neural Sheaf Diffusion**:
    **A Spectral Filtering Approach on Cellular Sheaves**”, co-authored with Pietro
    Lio' and Fabrizio Silvestri, is now online.\n\n\U0001F50D **What**’**s the core
    idea**?\n**Sheaf Neural Networks** are a specific typology of graph neural networks,
    powerful on heterophilic graphs because they learn how information should be transported
    between nodes via local linear maps. Existing Neural Sheaf Diffusion (NSD) models,
    however, are limited to one-step diffusion per layer, often need large stalk dimensions
    and heavy dense transports, and can struggle with depth and efficiency.\n\nWe
    propose **Polynomial Neural Sheaf Diffusion** (**PolyNSD**), which replaces one-step
    diffusion with a degree-K polynomial filter of the (rescaled) sheaf Laplacian,
    evaluated via a Chebyshev-style recurrence. In practice, a single PolyNSD layer
    has an explicit K-hop receptive field, a trainable spectral response, and relies
    only on sparse mat-vec operations (no eigen-decomposition).\n\n\U0001F9E0 **Key
    Contributions in a Nutshell**\n- **Polynomial Sheaf Diffusion Layer**:  A general
    framework that applies orthogonal-polynomial spectral filters to the sheaf Laplacian,
    enabling long-range mixing and fine-grained control over low-, band- and high-pass
    behaviour in one layer. \n- **Parameter**-**Efficient and Scalable**: The propagation
    is governed by just K+1 scalar coefficients per layer, reusing the same transports.
    We show that simple diagonal transports are already enough to reach state-of-the-art
    performance, challenging the need for very high-dimensional stalks and dense maps.\n-
    **Unified Treatment of Homophily** & **Heterophily**: With a single architecture,
    PolyNSD achieves competitive or state-of-the-art results on both homophilic citation
    graphs and challenging heterophilic benchmarks, while being more robust to depth
    and oversmoothing.\n- **Extensive Empirical Analysis**: We systematically study
    depth, polynomial degree, spectral scaling and efficiency. PolyNSD consistently
    outperforms or matches NSD at fixed depth, often with fewer parameters and lower
    memory footprint.\n\nIf you’re working on GNNs, heterophily, spectral methods,
    or topological deep learning, I’d love to hear your thoughts and ideas about it!\n\n\U0001F449
    Link to the paper in the comments!\n\n#GNN #SheafNeuralNetworks #GraphNeuralNetworks
    #TopologicalDeepLearning #SpectralGNNs #MachineLearning #DeepLearning #Heterophily"
  gallery: "/images/linkedin/new-paper-out-polynomial-neural-sheaf-diffusion-preprint/"
