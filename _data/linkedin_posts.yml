- title: Visiting Research - Johannes Kepler University
  date: '2024-09-03'
  place: "Linz, Austria \U0001F1E6\U0001F1F9"
  url: https://www.linkedin.com/feed/update/urn:li:activity:7238445265127436288/
  embed_url: https://www.linkedin.com/embed/feed/update/urn:li:activity:7238445265127436288/
  body: "\U0001F31F Incredible Experience at IT:U- Interdisciplinary Transformation
    University Austria in Linz, Upper Austria and Introduction of **CareConnect**
    ! \U0001F31F\n\nI’m thrilled to share the amazing journey I had at the International
    Technology University (ITU) in Linz, Upper Austria, at the Johannes Kepler Universität
    Linz Science Park. Over the last two weeks, I had the privilege of working on
    **CareConnect**, an AI-driven project aimed at improving patient care and hospital
    efficiency. By integrating the power of **LangChain**, we enabled natural language
    queries that interact with real-time environmental data in hospital rooms. This
    allows healthcare staff to monitor and control hospital conditions effortlessly
    through a user-friendly interface—just by asking questions! \n\nThe system also
    **generates real**-**time generated graphs**, that provide insights from the data
    and can even **self**-**explain** by suggesting actions based on the visualizations.
    One of the most exciting features is the ability to trigger the movement of a
    **robot arm**, which can automatically perform tasks like opening or closing windows
    based on environmental conditions.\n\nIndeed, one of the most exciting aspects
    of the project was the **integration of robotics**. Using a robot arm, the system
    can trigger physical actions—like automatically opening or closing windows based
    on environmental data. \n\nI’m incredibly grateful to my talented teammates Oliver
    Guy Simone Redl, Amina Tucaković and Hamed Kshiem. A huge thanks to Alexander
    Steinmaurer and Gala Dojcinovic for the opportunity. A big thanks also to the
    best mentor Thorsten Ruprechter, for his guidance and support.\n\nThis experience
    has been an unforgettable chapter, and I can’t wait to see where we go from here!
    \U0001F680\n\n\U0001F517\U0001F449Discover **CareConnect**: https://lnkd.in/dUbE76-b\n\n#AI
    #LangChain #Robotics #HealthcareInnovation #TechForGood #Teamwork #JohannesKeplerUniversity
    #CareConnect #Linz #Grateful #TechnologyInHealthcare #ITU #Linz"
  gallery: "/images/linkedin/visiting-research-johannes-kepler-university/"
