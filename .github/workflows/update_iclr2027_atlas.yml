name: Refresh ICLR 2027 Review Atlas

on:
  workflow_dispatch:
  push:
    paths:
      - 'iclr2027-atlas/**'
      - '.github/workflows/update_iclr2027_atlas.yml'
  schedule:
    - cron: '37 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: iclr2027-review-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Fetch complete ICLR 2027 public official reviews
        run: |
          # Prefer the official public endpoint. OpenReview's bot challenge may
          # return 403; a date-stamped independent public numeric snapshot
          # then keeps the website useful without inventing fresh scores.
          python iclr2027-atlas/collect_snapshot.py --limit 150 || \
            python iclr2027-atlas/import_public_snapshot.py
      - name: Commit updated dataset if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iclr2027-atlas/snapshot.json
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh ICLR 2027 public review snapshot'
          git push